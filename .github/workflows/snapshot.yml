name: CCTV Stealth Snapshot Runner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cctv_snapshot]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies for Real Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgl1-mesa-dri libglx-mesa0 libgl1 mesa-utils
          npm install --no-audit --prefer-offline

      - name: Run Real Browser Snapshot Capture
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8899978543:AAHlrCjXZbiJwcI_OZIzXrGdpKC5_BCGCEs' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.CHAT_ID || '1936436999' }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x850x24 +extension GLX" node capture.js

      - name: Upload Snapshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctv-banyuasin-screenshot
          path: cctv_banyuasin_live.jpg
          if-no-files-found: ignore
