name: CCTV Stealth Snapshot Runner

on:
  workflow_dispatch:
    inputs:
      cam_id:
        description: 'Nomor ID Kamera Banyuasin (contoh: 4)'
        required: false
        default: '4'
      engine:
        description: 'Engine browser (camoufox, puppeteer, atau playwright)'
        required: false
        default: 'camoufox'
  repository_dispatch:
    types: [cctv_snapshot]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Python for Byparr Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies for Real Browser & Camoufox
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgl1-mesa-dri libglx-mesa0 libgl1 mesa-utils libgtk-3-0 libasound2t64 || sudo apt-get install -y xvfb libgbm-dev
          npm install --no-audit
          pip install "camoufox[geoip]"
          python3 -m camoufox fetch

      - name: Connect Tailscale to HP Exit Node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --exit-node=100.71.31.19 --exit-node-allow-lan-access=true

      - name: Verify Mobile IP Route
        run: |
          echo "=== Tailscale Status ==="
          tailscale status
          echo "=== Testing Direct Tailscale Ping to HP ==="
          tailscale ping -c 3 100.71.31.19 || true
          echo "=== Outgoing Public IP (Testing DNS & Connection) ==="
          curl -s --max-time 15 https://api.ipify.org || echo "curl exit-node timeout, continuing..."
          echo ""

      - name: Run Real Browser Snapshot Capture
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8899978543:AAHlrCjXZbiJwcI_OZIzXrGdpKC5_BCGCEs' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.CHAT_ID || '1936436999' }}
          CAM_TARGET: ${{ github.event.inputs.cam_id || github.event.client_payload.cam_id || 'pasar p.balai' }}
          CF_CLEARANCE: ${{ vars.CF_CLEARANCE }}
        run: |
          ENGINE="${{ github.event.inputs.engine || github.event.client_payload.engine || 'camoufox' }}"
          if [ "$ENGINE" = "camoufox" ]; then
            echo "Running with Camoufox (Byparr Engine - Firefox C++ Stealth)..."
            xvfb-run --auto-servernum --server-args="-screen 0 1280x850x24 +extension GLX" python3 capture_camoufox.py
          elif [ "$ENGINE" = "puppeteer" ]; then
            echo "Running with Puppeteer-Real-Browser..."
            xvfb-run --auto-servernum --server-args="-screen 0 1280x850x24 +extension GLX" node capture.js
          else
            echo "Running with Rebrowser-Playwright Stealth..."
            xvfb-run --auto-servernum --server-args="-screen 0 1280x850x24 +extension GLX" node capture_playwright.js
          fi

      - name: Send Captured Snapshot Directly to Telegram
        if: success()
        run: |
          if [ -f "cctv_banyuasin_live.jpg" ]; then
            echo "Sending verified snapshot to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot8899978543:AAHlrCjXZbiJwcI_OZIzXrGdpKC5_BCGCEs/sendPhoto" \
              -F "chat_id=1936436999" \
              -F "photo=@cctv_banyuasin_live.jpg" \
              -F "caption=📸 <b>Snapshot Live Realtime [CCTV Kab. Banyuasin]</b> 🚦%0A%0A🏢 <b>Wilayah:</b> Kab. Banyuasin (Diskominfo)%0A🕒 <b>Waktu:</b> $(date '+%d/%m/%Y %H:%M:%S') WIB%0A🛡️ <b>Status:</b> Cloudflare Turnstile 100% Bypass (Mobile Gateway)%0A🔗 <b>Portal:</b> https://cctv.banyuasinkab.go.id/" \
              -F "parse_mode=HTML" || true
          fi



      - name: Upload Snapshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctv-banyuasin-screenshot
          path: cctv_banyuasin_live.jpg
          if-no-files-found: ignore
