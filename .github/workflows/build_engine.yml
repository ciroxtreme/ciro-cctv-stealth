name: Build and Release x86_64 capture_cctv Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang cmake

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build cfsolve v5.0 capture engine
        working-directory: ./cfsolve
        run: |
          cargo build --release --bin capture_cctv
          strip target/release/capture_cctv
          cp target/release/capture_cctv ../bin/capture_cctv

      - name: Commit Updated Engine Binary
        run: |
          git config --local user.email "ciroxtreme@users.noreply.github.com"
          git config --local user.name "ciroxtreme"
          git add bin/capture_cctv
          git diff --staged --quiet || git commit -m "chore(engine): update prebuilt x86_64 capture_cctv v5.0 binary"
          git push origin main

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture_cctv_x86_64
          path: cfsolve/target/release/capture_cctv
