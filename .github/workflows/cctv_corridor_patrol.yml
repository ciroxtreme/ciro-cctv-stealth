name: CCTV Corridor Patrol (Palembang - Banyuasin)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter kamera (ALL, PALEMBANG, BANYUASIN, atau ID kamera)'
        required: false
        default: 'ALL'
  repository_dispatch:
    types: [cctv_snapshot]
  schedule:
    # Berjalan otomatis setiap 1 jam sekali (24/7)
    - cron: '0 * * * *'

jobs:
  patrol:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Prepare APT cache dir
        run: sudo mkdir -p /var/cache/apt/archives/partial && sudo chown -R $USER:$USER /var/cache/apt/archives

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-jammy-v1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl gpg

      - name: Install & Setup Official Cloudflare WARP SOCKS5 Tunnel
        run: |
          echo "📥 Memasang Cloudflare WARP client resmi..."
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -y
          sudo apt-get install -y cloudflare-warp

          sudo systemctl start warp-svc
          sleep 2

          # Auto registration & mode SOCKS5 proxy port 40000
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect

          sleep 3
          echo "✅ Status WARP:"
          warp-cli --accept-tos status
          
      - name: Fix APT cache ownership (so cache can be saved)
        run: sudo chown -R $USER:$USER /var/cache/apt/archives || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure Prebuilt Engine Permissions
        run: |
          chmod +x bin/capture_cctv

      - name: Run Full Corridor CCTV Patrol & Telegram Dispatch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.CHAT_ID || '1936436999' }}
          FILTER_TARGET: ${{ github.event.client_payload.filter || github.event.inputs.filter || 'ALL' }}
          CF_PROXY: "socks5://127.0.0.1:40000"
        run: |
          mkdir -p output
          python3 capture_corridor_ci.py

      - name: Upload Snapshot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctv-patrol-snapshots
          path: output/*.jpg
          if-no-files-found: ignore
