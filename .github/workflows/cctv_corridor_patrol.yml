name: CCTV Corridor Patrol (Palembang - Banyuasin)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter kamera (ALL, PALEMBANG, BANYUASIN, atau ID kamera)'
        required: false
        default: 'ALL'
  repository_dispatch:
    types: [cctv_snapshot]
  schedule:
    # Berjalan otomatis setiap 1 jam sekali (24/7)
    - cron: '0 * * * *'

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure Prebuilt Engine Permissions
        run: |
          chmod +x bin/capture_cctv

      - name: Run Full Corridor CCTV Patrol & Telegram Dispatch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '9050404111:AAHE6X1btKtiWIgBT8Lcp5DDMdUMEV2MbLk' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.CHAT_ID || '1936436999' }}
          FILTER_TARGET: ${{ github.event.client_payload.filter || github.event.inputs.filter || 'ALL' }}
          CF_PROXY: ${{ secrets.CF_PROXY || 'https://hello-fly-sbrnba.fly.dev:443' }}
        run: |
          mkdir -p output
          python3 capture_corridor_ci.py

      - name: Upload Snapshot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctv-patrol-snapshots
          path: output/*.jpg
          if-no-files-found: ignore
